<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <script src="../assets/js/theme.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Tìm giảng viên theo tên, email và nhóm chủ đề nghiên cứu." />
    <title>Giảng viên hướng dẫn | UIT Discovery</title>
    <link rel="icon" href="../assets/images/uit-logo.png" />
    <link rel="stylesheet" href="../assets/css/reset.css" />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/lecturers.css" />
    <script type="module" src="../assets/js/lecturers.js"></script>
  </head>
  <body id="page-lecturers">
    <a class="skip-link" href="#main-content">Đến nội dung chính</a>
    <header class="site-header">
      <div class="container site-header__inner">
        <a class="site-header__brand" href="../index.html"
          ><img
            class="site-header__logo-img"
            src="../assets/images/uit-logo.png"
            width="34"
            height="30"
            alt="UIT"
          /><span>UIT Discovery</span></a
        >
        <nav class="site-nav" aria-label="Điều hướng chính">
          <ul class="site-nav__list">
            <li><a class="site-nav__link" href="../topics/index.html">Khám phá</a></li>
            <li>
              <a class="site-nav__link" href="../lecturers/index.html" aria-current="page"
                >Giảng viên</a
              >
            </li>
          </ul>
        </nav>
        <button
          type="button"
          class="theme-toggle"
          aria-label="Giao diện sáng/tối"
          aria-pressed="false"
          title="Chuyển sang giao diện tối"
          hidden
        >
          <span class="theme-toggle__icon" aria-hidden="true">☀</span
          ><span class="theme-toggle__text">Sáng</span>
        </button>
      </div>
    </header>
    <main id="main-content" class="container page">
      <header class="page-header">
        <h1>Giảng viên hướng dẫn</h1>
        <p class="page-header__desc">Tìm người hướng dẫn từ các chủ đề nghiên cứu hiện có.</p>
      </header>
      <form id="lecturer-filter" class="lecturers-filter" role="search">
        <div class="form-group lecturers-filter__search">
          <label for="lecturer-search">Tên hoặc email</label
          ><input
            id="lecturer-search"
            type="search"
            placeholder="Ví dụ: Nguyễn Tấn Cầm"
            autocomplete="off"
          />
        </div>
        <div class="form-group">
          <label for="lecturer-group">Nhóm chủ đề</label
          ><select id="lecturer-group">
            <option value="">Tất cả nhóm</option>
          </select>
        </div>
        <div class="lecturers-filter__actions">
          <button class="btn" type="submit">Tìm</button
          ><button class="btn btn--quiet" type="reset">Xóa bộ lọc</button>
        </div>
      </form>
      <p id="lecturers-status" class="lecturers-status" role="status" aria-live="polite">
        Đang tải giảng viên…
      </p>
      <section
        class="lecturers-grid"
        id="lecturers-list"
        aria-label="Danh sách giảng viên"
      ></section>
      <nav
        id="lecturers-pagination"
        class="lecturers-pagination"
        aria-label="Phân trang danh sách giảng viên"
        hidden
      ></nav>
    </main>
    <footer class="site-footer">
      <div class="container site-footer__inner">
        <p>UIT Discovery · Đồ án IE104</p>
        <a href="../lecturers/index.html">Giảng viên hướng dẫn</a>
      </div>
    </footer>
    <noscript><p class="container">Hãy bật JavaScript để tải dữ liệu và xem lộ trình.</p></noscript>
  </body>
</html>
